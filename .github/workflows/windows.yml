name: Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l cmd internal)
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Error "gofmt required: $_" }
            throw "gofmt check failed"
          }
      - run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - run: go test ./...
      - name: Compile build-tagged E2E tests
        run: go test -tags=e2e -run "^$" ./internal/e2e
      - name: Build debug (console, symbols, no optimization)
        run: ./scripts/build-debug.ps1
      - name: Build release (windowsgui, stripped)
        run: ./scripts/build-release.ps1
      - name: Cross-compile Windows ARM64
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -Architecture arm64 -OutputName OmniSSHAgent-windows-arm64.exe
      - name: Installer integration
        shell: pwsh
        run: ./scripts/test-installer.ps1
