name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l cmd internal)
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Error "gofmt required: $_" }
            throw "gofmt check failed"
          }
          go vet ./...
          go test ./...
          ./scripts/test-installer.ps1
      - name: Build release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $commit = "${{ github.sha }}"
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          foreach ($arch in @("amd64", "arm64")) {
            $asset = "OmniSSHAgent-windows-$arch.exe"
            ./scripts/build-release.ps1 -Architecture $arch -OutputName $asset -Version $version -Commit $commit -BuildTime $buildTime
            $assetPath = Join-Path "dist" $asset
            $hash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset" | Set-Content -Encoding ascii "$assetPath.sha256"
          }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/OmniSSHAgent-windows-amd64.exe `
            dist/OmniSSHAgent-windows-amd64.exe.sha256 `
            dist/OmniSSHAgent-windows-arm64.exe `
            dist/OmniSSHAgent-windows-arm64.exe.sha256 `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes
